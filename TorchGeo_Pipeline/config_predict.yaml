# predict_config.yaml
model:
  class_path: torchgeo.trainers.SemanticSegmentationTask
  init_args:
    loss: "ce"
    model: "deeplabv3+"
    backbone: "resnet18"
    in_channels: 3
    num_classes: 3
    ignore_index: null

data:
  class_path: datasets.Geo_Data_Module.GeoDataModule
  init_args:
    big_image_path: "C:\\My Files\\Semester4TUM\\2017 Image Resampled\\R2C3.tif"
     batch_size: 1
     stride: 256
     num_workers: 0

trainer:
  max_epochs: 50           # irrelevant for prediction
  accelerator: "gpu"
  devices: 1
  precision: 32
  log_every_n_steps: 10
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: lightning_logs
      name: torchgeo
  callbacks:
    - class_path: torchgeo.callbacks.tiled_inference.TiledInferenceCallback
      init_args:
        tile_size: 512
        stride: 256
